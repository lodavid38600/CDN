services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017/douane_saas
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET}
      CORS_ORIGIN: http://localhost:4000
      EUROSTAT_BULK_FROM: ${EUROSTAT_BULK_FROM:-2015-01}
      AUTO_UPDATE: ${AUTO_UPDATE:-false}
    ports:
      - "4000:4000"

volumes:
  mongo-data:
